[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "DATAFORGE ANALYTICS shared utilities"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["SHARED_UTILS"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I"
]

ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"